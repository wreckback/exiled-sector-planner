<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-t="bar.pageTitle"></title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="tree"></canvas>

<header id="topbar">
  <div class="brand">
    <span class="brand-title" data-t="bar.brand"></span>
    <span class="brand-sub" data-t="bar.brandSub"></span>
  </div>

  <div class="bar-group" id="root-group">
    <span class="label" data-t="bar.root"></span>
    <span id="root-name" class="value muted" data-t="bar.chooseRoot"></span>
  </div>

  <div class="bar-group" id="tpl-group" hidden data-t-title="bar.template.title">
    <span class="label" data-t="bar.template"></span>
    <span id="tpl-current" class="value"></span>
    <span id="tpl-edited" class="muted" hidden data-t="bar.template.edited"></span>
  </div>

  <div class="bar-group">
    <span class="label" data-t="bar.nodes"></span>
    <span class="value"><span id="used">0</span> / <input id="cap" type="number" min="1" max="999" value="60" data-t-title="bar.cap.title"></span>
  </div>

  <div class="bar-group">
    <label class="label" for="hull" data-t="bar.hull"></label>
    <select id="hull">
      <option value="frigate" data-t="name.hull.frigate"></option>
      <option value="destroyer" data-t="name.hull.destroyer"></option>
      <option value="cruiser" selected data-t="name.hull.cruiser"></option>
      <option value="capitalShip" data-t="name.hull.capital"></option>
    </select>
  </div>

  <div class="bar-group search">
    <input id="search" type="search" data-t-placeholder="bar.search.placeholder" autocomplete="off">
    <span id="search-count" class="muted"></span>
    <button id="btn-themes" data-t-title="filter.button.title" aria-haspopup="true" aria-expanded="false" aria-pressed="false" aria-controls="theme-filter" data-t="filter.button"></button>
  </div>

  <div class="bar-group actions">
    <button id="btn-view" data-t-title="list.view.listTitle" aria-pressed="false" aria-controls="listview" data-t="list.view.list"></button>
    <button id="btn-fit" data-t="bar.center"></button>
    <button id="btn-undo" data-t="bar.undoButton"></button>
    <button id="btn-reset" data-t-title="bar.reset.title" data-t="bar.reset"></button>
    <button id="btn-targets" data-t-title="bar.targets.title" aria-pressed="false" aria-controls="targets" data-t="bar.targets"></button>
    <button id="btn-code" class="primary" data-t-title="bar.copyCode.title" data-t="bar.copyCode"></button>
    <button id="btn-ship" aria-controls="panel-ship" data-t="bar.shipRules"></button>
    <button id="btn-story" aria-haspopup="dialog" aria-controls="story" data-t="bar.optionalRules"></button>
    <button id="btn-export" data-t-title="bar.templates.title" aria-haspopup="dialog" aria-controls="export" data-t="bar.templates"></button>
    <button id="btn-checkfile" data-t-title="bar.checkFile.title" hidden data-t="bar.checkFile"></button>
    <button id="btn-art" aria-haspopup="dialog" aria-controls="art" data-t="assets.button.show"></button>
    <button id="btn-panel" data-t-title="bar.summary.title" data-t="bar.summary"></button>
    <button id="btn-theme"></button>
    <button id="btn-keys" aria-haspopup="dialog" aria-controls="keys" data-t="bar.shortcuts"></button>
  </div>
</header>

<aside id="panel">
  <div class="panel-head">
    <h2 data-t="panel.heading"></h2>
    <span id="panel-sub" class="muted"></span>
  </div>
  <div id="affinity"></div>
  <div id="aff-mix" hidden>
    <div class="aff-mix-row">
      <span><span class="muted" data-t="panel.affMix.count"></span> <b id="aff-count">0</b></span>
      <span class="aff-all"><span class="muted" data-t="panel.affMix.allTo"></span>
        <button data-all="low_tech_affinity" data-t-title="panel.affMix.lowTitle" data-t="panel.affMix.low"></button><button data-all="midline_affinity" data-t-title="panel.affMix.midTitle" data-t="panel.affMix.mid"></button><button data-all="high_tech_affinity" data-t-title="panel.affMix.highTitle" data-t="panel.affMix.high"></button></span>
    </div>
    <div class="aff-mix-row">
      <label><span data-t="panel.affMix.low"></span> <input data-mix="low_tech_affinity" type="number" min="0" step="1"></label>
      <label><span data-t="panel.affMix.mid"></span> <input data-mix="midline_affinity" type="number" min="0" step="1"></label>
      <label><span data-t="panel.affMix.high"></span> <input data-mix="high_tech_affinity" type="number" min="0" step="1"></label>
      <button id="aff-apply" data-t-title="panel.affMix.applyTitle" data-t="panel.affMix.apply"></button>
    </div>
    <div id="aff-note" class="muted"></div>
  </div>
  <div id="integ" hidden>
    <div class="aff-mix-row">
      <span id="integ-summary"></span>
      <span class="aff-all">
        <button id="integ-all" data-t="panel.integ.all"></button><button id="integ-none" data-t="panel.integ.none"></button></span>
    </div>
    <div class="aff-mix-row">
      <label data-t-title="panel.integ.previewTitle"><input id="integ-preview" type="checkbox"> <span data-t="panel.integ.previewLabel"></span></label>
      <label data-t-title="panel.integ.keepTitle"><input id="integ-keep" type="checkbox"> <span data-t="panel.integ.keepLabel"></span></label>
    </div>
    <div class="aff-mix-row">
      <label data-t-title="panel.integ.viewTitle"><span data-t="panel.integ.viewLabel"></span> <select id="integ-view"><option value="inline" data-t="panel.integ.viewInline"></option><option value="columns" data-t="panel.integ.viewColumns"></option></select></label>
    </div>
    <div id="integ-note" class="muted"></div>
  </div>
  <div class="panel-tabs">
    <button data-tab="stats" class="active" data-t="panel.tab.stats"></button>
    <button data-tab="sheet" data-t-title="panel.tab.sheet.title" data-t="panel.tab.sheet"></button>
    <button data-tab="nodes" data-t="panel.tab.nodes"></button>
    <button data-tab="ship" id="tab-ship" data-t="panel.tab.ship"></button>
    <button data-tab="search" id="tab-search" hidden data-t="panel.tab.search"></button>
  </div>
  <div id="panel-body"></div>
  <div id="panel-ship" hidden>
    <p class="muted" data-t="ship.intro"></p>
    <p id="ship-summary"></p>
    <div id="ship-problems"></div>

    <h3 data-t="ship.optionsHeading"></h3>
    <table class="ship-form">
      <tr><td><label for="ship-shield" data-t="ship.shield.label"></label></td><td>
        <select id="ship-shield">
          <option value="" data-t="common.notSet"></option>
          <option value="FRONT" data-t="ship.shield.front"></option>
          <option value="OMNI" data-t="ship.shield.omni"></option>
          <option value="NONE" data-t="ship.shield.none"></option>
          <option value="PHASE" data-t="ship.shield.phase"></option>
        </select></td></tr>
      <tr><td><label for="ship-armor" data-t="ship.armor.label"></label> <span class="muted" data-t="ship.armor.hint"></span></td><td>
        <input id="ship-armor" type="number" min="0" max="99999" step="1" data-t-placeholder="common.notSet"></td></tr>
      <tr><td colspan="2" id="ship-armor-note" class="muted"></td></tr>
      <tr><td><label for="ship-civilian" data-t="ship.civilian.label"></label></td><td>
        <select id="ship-civilian" data-tri="civilian"><option value="" data-t="common.notSet"></option><option value="1" data-t="common.yes"></option><option value="0" data-t="common.no"></option></select></td></tr>
      <tr><td><label for="ship-charges" data-t="ship.charges.label"></label></td><td>
        <select id="ship-charges" data-tri="charges"><option value="" data-t="common.notSet"></option><option value="1" data-t="common.yes"></option><option value="0" data-t="common.no"></option></select></td></tr>
      <tr><td><label for="ship-modules" data-t="ship.modules.label"></label></td><td>
        <select id="ship-modules" data-tri="modules"><option value="" data-t="common.notSet"></option><option value="1" data-t="common.yes"></option><option value="0" data-t="common.no"></option></select></td></tr>
      <tr><td><label for="ship-wings" data-t="ship.wings.label"></label></td><td>
        <select id="ship-wings" data-tri="builtInWings"><option value="" data-t="common.notSet"></option><option value="1" data-t="common.yes"></option><option value="0" data-t="common.no"></option></select></td></tr>
    </table>

    <h3 data-t="ship.hullmodsHeading"></h3>
    <div id="ship-mods"></div>
    <p><label for="ship-mod-input" data-t="ship.addHullmod.label"></label><br>
      <input id="ship-mod-input" list="ship-mod-list" type="text" autocomplete="off" data-t-placeholder="ship.addHullmod.placeholder" style="width:100%">
      <datalist id="ship-mod-list"></datalist></p>
    <p id="ship-mod-status" class="bad" role="status"></p>

    <h3 data-t="ship.logisticsHeading"></h3>
    <p><label for="ship-logistics" data-t="ship.logistics.label"></label> <input id="ship-logistics" type="number" min="0" max="20" step="1" value="0"></p>
    <p id="ship-logistics-note" class="muted"></p>

    <div class="export-actions"><button id="ship-clear" data-t="ship.reset"></button></div>
  </div>
  <footer id="panel-foot"></footer>
</aside>

<div id="banner" hidden></div>
<div id="targets" role="region" data-t-aria-label="target.bar.label" hidden>
  <div><b data-t="target.bar.heading"></b> <span class="muted" data-t="target.bar.intro"></span></div>
  <div><span id="targets-counts"></span> <span id="targets-status" role="status"></span></div>
  <div class="export-actions">
    <label data-t-title="target.bar.keepTitle"><input id="targets-keep" type="checkbox" checked> <span data-t="target.bar.keep"></span></label>
    <button id="targets-apply" class="primary" data-t="target.bar.apply"></button>
    <button id="targets-clear" data-t="target.bar.clear"></button>
    <button id="targets-done" data-t-title="target.bar.doneTitle" data-t="target.bar.done"></button>
  </div>
</div>
<div id="file-notice" role="alertdialog" aria-labelledby="file-notice-msg" hidden>
  <p id="file-notice-msg"></p>
  <div class="export-actions">
    <button id="fn-load" class="primary" data-t="templates.notice.load"></button>
    <button id="fn-open" data-t="templates.notice.open"></button>
    <button id="fn-dismiss" data-t="templates.notice.dismiss"></button>
  </div>
</div>
<section id="listview" data-t-aria-label="list.label" hidden>
  <div class="lv-bar">
    <span class="lv-modes" role="group" data-t-aria-label="list.modes.label">
      <button type="button" data-mode="all" aria-pressed="true" data-t-title="list.mode.allTitle" data-t="list.mode.all"></button>
      <button type="button" data-mode="build" aria-pressed="false" data-t-title="list.mode.buildTitle"></button>
    </span>
    <span id="listview-count" class="muted"></span>
    <span id="listview-hint" class="muted lv-hint"></span>
    <label><span data-t="list.sort"></span> <select id="listview-sort">
      <option value="name" data-t="list.sort.name"></option>
      <option value="tree" data-t="list.sort.tree"></option>
      <option value="order" data-t="list.sort.order"></option>
    </select></label>
    <span id="listview-groups" class="lv-groups" hidden>
      <button id="lv-collapse-all" data-t="list.collapseAll"></button>
      <button id="lv-expand-all" data-t="list.expandAll"></button>
    </span>
  </div>
  <div id="listview-body"></div>
</section>
<div id="theme-filter" role="group" data-t-aria-label="filter.heading" hidden></div>
<div id="statsheet" role="dialog" aria-modal="true" aria-labelledby="statsheet-title" hidden>
  <div class="gs-bar">
    <h2 id="statsheet-title" data-t="sheet.title"></h2>
    <span id="statsheet-sub" class="gs-sub"></span>
    <button id="statsheet-side" data-t-title="sheet.sideTitle" data-t="sheet.side"></button>
    <button id="statsheet-close" data-t-title="common.closeEsc" data-t="common.close"></button>
  </div>
  <div id="statsheet-body" class="gs gs-full"></div>
</div>
<div id="sheet-tip" hidden></div>
<div id="tooltip" hidden></div>
<div id="picker" hidden></div>
<div id="toast" hidden></div>

<div id="export" role="dialog" aria-modal="true" aria-labelledby="export-title" hidden>
  <div class="keys-head">
    <h2 id="export-title" data-t="templates.title"></h2>
    <button id="export-close" data-t-title="common.closeEsc" data-t="common.close"></button>
  </div>
  <div class="keys-body">
    <p data-t-html="templates.intro"></p>

    <h3 data-t="templates.fileHeading"></h3>
    <p id="tf-status"></p>
    <div class="export-actions">
      <button id="tf-link" class="primary" data-t="templates.file.link"></button>
      <button id="tf-create" hidden data-t-title="templates.createTitle" data-t="templates.create"></button>
      <button id="tf-reconnect" hidden data-t="common.reconnect"></button>
      <button id="tf-reload" hidden data-t="templates.reload"></button>
      <button id="tf-forget" hidden data-t="common.forget"></button>
    </div>
    <p id="tf-note" class="muted"></p>
    <div id="tf-watch-row">
      <p><label for="tf-watch-mode" data-t="templates.watch.label"></label>
        <select id="tf-watch-mode">
          <option value="observe" data-t="templates.watch.observe"></option>
          <option value="poll" data-t="templates.watch.poll"></option>
          <option value="off" data-t="templates.watch.manual"></option>
        </select></p>
      <p id="tf-watch-secs"><label for="tf-watch" data-t="templates.watch.every"></label> <input id="tf-watch" type="number" min="1" max="600" step="1" value="2"> <span data-t="templates.watch.seconds"></span></p>
      <p id="tf-watch-note"></p>
      <p id="tf-watch-limits" class="muted"></p>
    </div>

    <h3 data-t="templates.importHeading"></h3>
    <div id="tf-list"><p class="muted" data-t="templates.list.link"></p></div>

    <h3 data-t="templates.exportHeading"></h3>
    <p><label for="tpl-name" data-t="templates.nameLabel"></label><br>
      <input id="tpl-name" type="text" maxlength="32" autocomplete="off" style="width:100%"></p>
    <p id="tpl-summary" class="muted"></p>

    <div class="export-actions">
      <button id="tpl-save" class="primary" data-t="templates.saveLinked"></button>
    </div>
    <p id="tpl-save-note" class="muted"></p>

    <div id="tpl-conflict" role="group" aria-labelledby="tpl-conflict-msg" hidden>
      <p id="tpl-conflict-msg"></p>
      <div class="export-actions">
        <button id="tpl-keep" class="primary"></button>
        <button id="tpl-change"></button>
      </div>
      <p><label for="tpl-newname" data-t="templates.conflict.newNameLabel"></label><br>
        <input id="tpl-newname" type="text" maxlength="32" autocomplete="off" style="width:100%"></p>
      <div class="export-actions">
        <button id="tpl-asnew" data-t="templates.conflict.asNew"></button>
        <button id="tpl-cancel" data-t="common.cancel"></button>
      </div>
    </div>

    <h3 data-t="templates.codeHeading"></h3>
    <p class="muted" data-t="templates.codeIntro"></p>
    <div class="export-actions">
      <button id="code-copy" data-t="templates.code.copyButton"></button>
    </div>
    <p><label for="code-box" data-t="templates.code.boxLabel"></label><br>
      <textarea id="code-box" rows="3" spellcheck="false" autocomplete="off" data-t-placeholder="templates.code.placeholder"></textarea></p>
    <div class="export-actions">
      <button id="code-load" data-t="templates.code.loadButton"></button>
    </div>
    <p id="code-status" role="status"></p>

    <h3 data-t="templates.otherHeading"></h3>
    <div class="export-actions">
      <button id="tpl-new" data-t="templates.download"></button>
    </div>
    <input id="tpl-file" type="file" accept=".data,.json,application/json" hidden>
    <p id="tpl-status" role="status"></p>
  </div>
</div>

<div id="art" role="dialog" aria-modal="true" aria-labelledby="art-title" hidden>
  <div class="keys-head">
    <h2 id="art-title" data-t="assets.title"></h2>
    <button id="art-close" data-t-title="common.closeEsc" data-t="common.close"></button>
  </div>
  <div class="keys-body">
    <p data-t="assets.intro"></p>

    <h3 data-t="assets.folderHeading"></h3>
    <p id="art-status"></p>
    <div class="export-actions">
      <button id="art-choose" class="primary" data-t="assets.choose"></button>
      <button id="art-reconnect" hidden data-t="common.reconnect"></button>
      <button id="art-forget" hidden data-t="common.forget"></button>
    </div>
    <p id="art-note"></p>
    <p id="art-browser" class="muted"></p>
    <input id="art-files" type="file" webkitdirectory multiple hidden>
  </div>
</div>

<div id="story" role="dialog" aria-modal="true" aria-labelledby="story-title" hidden>
  <div class="keys-head">
    <h2 id="story-title" data-t="optional.title"></h2>
    <button id="story-close" data-t-title="common.closeEsc" data-t="common.close"></button>
  </div>
  <div class="keys-body">
    <p id="story-summary"></p>

    <h3 data-t="optional.wormholesHeading"></h3>
    <div id="story-other" class="ship-checks"></div>

    <h3 data-t="optional.volumesHeading"></h3>
    <p class="muted" data-t="optional.volumes.intro"></p>
    <div id="story-volumes" class="ship-checks"></div>

    <h3 data-t="optional.gatesHeading"></h3>
    <div class="export-actions">
      <button id="story-gate-all" data-t="common.tickAll"></button>
      <button id="story-gate-none" data-t="common.untickAll"></button>
    </div>
    <div id="story-gates" class="ship-checks"></div>

    <h3 data-t="optional.unlocksHeading"></h3>
    <div class="export-actions">
      <button id="story-unlock-all" data-t="common.tickAll"></button>
      <button id="story-unlock-none" data-t="common.untickAll"></button>
    </div>
    <div id="story-unlocks" class="ship-checks"></div>

    <h3 data-t="optional.integHeading"></h3>
    <p class="muted" data-t="optional.integ.intro"></p>
    <label><span data-t="optional.integ.label"></span>
      <select id="story-integ-cost">
        <option value="EXPONENTIAL" data-t="optional.integ.exponential"></option>
        <option value="ADDITIVE" data-t="optional.integ.additive"></option>
        <option value="STATIC" data-t="optional.integ.static"></option>
      </select>
    </label>

    <div class="export-actions" style="margin-top:12px">
      <button id="story-clear" data-t="optional.reset"></button>
    </div>
  </div>
</div>

<div id="keys" role="dialog" aria-modal="true" aria-labelledby="keys-title" hidden>
  <div class="keys-head">
    <h2 id="keys-title" data-t="keys.title"></h2>
    <button id="keys-close" data-t-title="common.closeEsc" data-t="common.close"></button>
  </div>
  <div class="keys-body">
    <h3 data-t="keys.keyboard"></h3>
    <table>
      <tr><td data-t-html="keys.pan.keys"></td><td data-t-html="keys.pan"></td></tr>
      <tr><td data-t-html="keys.zoomIn.keys"></td><td data-t-html="keys.zoomIn"></td></tr>
      <tr><td data-t-html="keys.zoomOut.keys"></td><td data-t-html="keys.zoomOut"></td></tr>
      <tr><td data-t-html="keys.undo.keys"></td><td data-t-html="keys.undo"></td></tr>
      <tr><td data-t-html="keys.home.keys"></td><td data-t-html="keys.home"></td></tr>
      <tr><td data-t-html="keys.panel.keys"></td><td data-t-html="keys.panel"></td></tr>
      <tr><td data-t-html="keys.targets.keys"></td><td data-t-html="keys.targets"></td></tr>
      <tr><td data-t-html="keys.list.keys"></td><td data-t-html="keys.list"></td></tr>
      <tr><td data-t-html="keys.integrate.keys"></td><td data-t-html="keys.integrate"></td></tr>
      <tr><td data-t-html="keys.search.keys"></td><td data-t-html="keys.search"></td></tr>
      <tr><td data-t-html="keys.help.keys"></td><td data-t-html="keys.help"></td></tr>
      <tr><td data-t-html="keys.escape.keys"></td><td data-t-html="keys.escape"></td></tr>
    </table>
    <p class="muted" data-t="keys.typingNote"></p>

    <h3 data-t="keys.searchBox"></h3>
    <table>
      <tr><td data-t-html="keys.searchEscape.keys"></td><td data-t-html="keys.searchEscape"></td></tr>
    </table>

    <h3 data-t="keys.mouse"></h3>
    <table>
      <tr><td data-t-html="keys.click.keys"></td><td data-t-html="keys.click"></td></tr>
      <tr><td data-t-html="keys.clickChoice.keys"></td><td data-t-html="keys.clickChoice"></td></tr>
      <tr><td data-t-html="keys.ctrlChoice.keys"></td><td data-t-html="keys.ctrlChoice"></td></tr>
      <tr><td data-t-html="keys.waypoint.keys"></td><td data-t-html="keys.waypoint"></td></tr>
      <tr><td data-t-html="keys.altIntegrate.keys"></td><td data-t-html="keys.altIntegrate"></td></tr>
      <tr><td data-t-html="keys.rightClick.keys"></td><td data-t-html="keys.rightClick"></td></tr>
      <tr><td data-t-html="keys.rightRoot.keys"></td><td data-t-html="keys.rightRoot"></td></tr>
      <tr><td data-t-html="keys.wormhole.keys"></td><td data-t-html="keys.wormhole"></td></tr>
      <tr><td data-t-html="keys.ctrlJump.keys"></td><td data-t-html="keys.ctrlJump"></td></tr>
      <tr><td data-t-html="keys.treeName.keys"></td><td data-t-html="keys.treeName"></td></tr>
      <tr><td data-t-html="keys.targetClick.keys"></td><td data-t-html="keys.targetClick"></td></tr>
      <tr><td data-t-html="keys.targetRight.keys"></td><td data-t-html="keys.targetRight"></td></tr>
      <tr><td data-t-html="keys.drag.keys"></td><td data-t-html="keys.drag"></td></tr>
      <tr><td data-t-html="keys.wheel.keys"></td><td data-t-html="keys.wheel"></td></tr>
    </table>

    <h3 data-t="keys.touch"></h3>
    <table>
      <tr><td data-t-html="keys.tap.keys"></td><td data-t-html="keys.tap"></td></tr>
      <tr><td data-t-html="keys.tapAgain.keys"></td><td data-t-html="keys.tapAgain"></td></tr>
      <tr><td data-t-html="keys.tapRoot.keys"></td><td data-t-html="keys.tapRoot"></td></tr>
      <tr><td data-t-html="keys.touchDrag.keys"></td><td data-t-html="keys.touchDrag"></td></tr>
